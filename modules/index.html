<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Refresh JS</title>
  </head>

  <body>
    <h1 class="title">Refresh JavaScript</h1>

    <p id="description">
      This is a simple page to demonstrate JavaScript concepts.
    </p>
    <p id="another-description">
      This is another paragraph to demonstrate JavaScript concepts.
    </p>

    <section aria-labelledby="events-title">
      <h2 id="events-title">JavaScript events</h2>

      <button id="count-button" type="button">Count a click</button>
      <p id="count-output" aria-live="polite">
        Button has not been clicked yet.
      </p>

      <form id="greeting-form">
        <label for="name-input">Your name</label>
        <input id="name-input" name="name" type="text" required />
        <button type="submit">Say hello</button>
      </form>
      <p id="name-feedback" aria-live="polite">You have typed 0 characters.</p>
      <p id="greeting-output" aria-live="polite"></p>
    </section>

    <script src="practice.js"></script>
    <!-- <script src="events.js"></script> -->
  </body>
</html>
