<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Refresh JS</title>
  </head>

  <body>
    <h1 class="title">Refresh JavaScript</h1>

    <p id="description">
      This is a simple page to demonstrate JavaScript concepts.
    </p>
    <p id="another-description">
      This is another paragraph to demonstrate JavaScript concepts.
    </p>

    <section aria-labelledby="timer-title">
      <h2 id="timer-title">Countdown timer</h2>

      <label for="timer-duration">Duration in seconds (1-3600)</label>
      <input id="timer-duration" type="number" min="1" max="3600" value="10" />
      <p id="timer-display" role="timer" aria-live="off">00:10</p>
      <button id="timer-start" type="button">Start</button>
      <button id="timer-pause" type="button" disabled>Pause</button>
      <button id="timer-reset" type="button">Reset</button>
      <p id="timer-status" aria-live="polite">Ready.</p>
    </section>

    <section aria-labelledby="storage-title">
      <h2 id="storage-title">Web storage</h2>

      <label for="favorite-color">Favorite color</label>
      <select id="favorite-color">
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="purple">Purple</option>
      </select>
      <button id="storage-save" type="button">Save preference</button>
      <button id="storage-load" type="button">Load preference</button>
      <button id="storage-clear" type="button">Remove preference</button>
      <p id="storage-status" aria-live="polite">No preference loaded.</p>
    </section>

    <script src="practice.js"></script>
    <!-- <script src="events.js"></script> -->
    <!-- <script src="form.js"></script> -->
    <script src="timer.js"></script>
    <script src="webstorage.js"></script>
  </body>
</html>
